[project]
name = "nivesh"
version = "0.1.0"
description = "Deterministic market intelligence for Indian equities with an evidence-backed LLM copilot"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openai>=1.50",
    "sqlglot>=25.0",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.scripts]
nivesh = "nivesh.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nivesh"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
